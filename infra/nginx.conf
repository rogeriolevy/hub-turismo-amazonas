# Replace domain/certificate paths. Node must remain bound to loopback.
server {
    listen 80;
    server_name hub.example.com;
    # Redirect to the configured canonical host, not the request-supplied Host header.
    return 301 https://$server_name$request_uri;
}
server {
    listen 443 ssl;
    server_name hub.example.com;
    ssl_certificate /etc/letsencrypt/live/hub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.com/privkey.pem;
    # Leave room for multipart framing; the application enforces a 16 MB body limit.
    client_max_body_size 17m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3005;
        # Use the configured canonical host; discard Host/X-Forwarded-Host supplied by clients.
        proxy_set_header Host $server_name;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
